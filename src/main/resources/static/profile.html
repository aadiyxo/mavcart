<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVcart - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>

    <!-- title banner -->
    <div class="title-banner">
        <h1 class="site-title"><span class="title-bold">MAV</span><span class="title-italic">cart</span></h1>
    </div>

    <!-- tab bar -->
    <div class="tab-bar">
        <a href="index.html" class="nav-item">
            <span class="icon">&#8962;</span>
            <span>Home</span>
        </a>
        <a href="cart.html" class="nav-item">
            <span class="icon">&#128722;</span>
            <span>Cart</span>
        </a>
        <a href="wishlist.html" class="nav-item">
            <span class="icon">&#9825;</span>
            <span>Wishlist</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">&#128100;</span>
            <span>Profile</span>
        </a>
        <a href="login.html" class="login-btn">Login</a>
    </div>

    <!-- guest view: shown when not logged in -->
    <div id="guest-view" class="guest-outer">
        <div class="guest-card">
            <div class="profile-banner">&#128100;</div>
            <h2 class="guest-text">You're not logged in</h2>
            <p class="guest-subtext">Login to view your profile and orders</p>
            <a href="login.html" class="auth-btn guest-login-btn">Login</a>
        </div>
    </div>

    <!-- profile view: shown when logged in -->
    <div id="profile-view" style="display: none;">

        <div class="profile-header">
            <div class="profile-banner">&#128100;</div>
            <h2 class="profile-name">Welcome back</h2>
            <p class="profile-email" id="profile-email-display">user@example.com</p>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </div>

        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>0</h3>
                <p>Orders</p>
            </div>
            <div class="stat-card">
                <h3>0</h3>
                <p>Wishlist</p>
            </div>
            <div class="stat-card">
                <h3>&#8377;0</h3>
                <p>Total Spent</p>
            </div>
        </div>

        <h3 class="section-title">Recent Orders</h3>

        <div class="order-list">
            <p class="empty-cart">No orders yet.</p>
        </div>

    </div>

    <!-- footer -->
    <footer>
        <p class="footer-brand">MAVcart</p>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>

    <script src="js/cart.js"></script>

</body>
</html>
